databases:
  - name: docspace-db
    plan: free
    databaseName: docspace
    user: docspace

services:
  - type: web
    name: docspace-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: docspace-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SERVER_PORT
        value: 8080
    healthCheckPath: /api/health
