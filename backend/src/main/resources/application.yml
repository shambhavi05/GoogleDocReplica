server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: docspace-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/docspace}
    username: ${DB_USERNAME:docspace}
    password: ${DB_PASSWORD:docspace}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

docspace:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.docspace: INFO
