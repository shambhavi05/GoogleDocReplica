server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        # SameSite=None + Secure is required for the session cookie to survive a
        # cross-site request when the frontend (Vercel) and backend (Render) are on
        # different domains. Secure=true requires HTTPS, which both platforms provide;
        # browsers reject SameSite=None over plain HTTP anyway.
        same-site: ${COOKIE_SAME_SITE:lax}
        secure: ${COOKIE_SECURE:false}

spring:
  application:
    name: docspace-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/docspace}
    username: ${DB_USERNAME:docspace}
    password: ${DB_PASSWORD:docspace}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

docspace:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.docspace: INFO
